<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div id="bg"></div>
    <he class="wrap">
        <header class="bar">
        <b class="logo">☁️ My Weather App</b>

        <div class="search" role="search">
            <input id="q" type="text" placeholder="Search any City" aria-label="Search City" autocomplete="off" role="combox" aria-controls="results">
            <button class="btn" id="go">Search</button>
            <ul id="result" role="listbox" class="card" hidden></ul>
        </div>

        <button class="btn" id="geo">⌖ My Location</button>
        <select class="btn" id="favSel" aria-label="Saved Cities"></select>
        <div class="grow"></div>
        <div class="seg" id="tuSeg" role="group" aria-label="Temperature unit">
            <button class="btn" data-v="C">°C</button>
            <button class="btn" data-v="F">°F</button>
        </div>

        <div class="seg" id="wuSeg" role="group" aria-label="Wind Unit">
            <button class="btn" data-v="kmh">km/h</button>
            <button class="btn" data-v="mph">mph</button>
            <button class="btn" data-v="ms">m/s</button>
        </div>

        <button class="btn" id="theme" aria-label="Toggle theme">🌓</button>

    </header>

    <div class="titlebar">
        <div class="grow"><h1 id="city">Loading...</h1><p class="muted" id="muted" id="sub"></p></div>
        <span class="muted" id="stuts" aria-live="polite"></span>
        <button class="btn" id="fav"> ☆ Save</button>
        <button class="btn" id="share">🔗 Coppt link</button>
        <button class="btn" id="refresh">🔄Refresh</button>
    </div>

    <div id="error" class="card error" role="alert" hidden><span id="errMzg"></span>
    <button class="btn" id="retry">Retry</button></div>

    




    </main>
    
</body>
</html>
